params_version: "v6"

universe:
  top_n: 30
  quote: USDT
  exclude: [USDCUSDT, FDUSDUSDT]
  refresh_hours: 24

publishing:
  # paper  : сигналы пишутся в журнал с пометкой paper и публикуются в канал
  # confirm: каждый пост ждёт кнопки владельца
  # auto   : публикация без подтверждения
  mode: paper
  paused: false
  kill_switch: false

risk:
  deposit_usd: 1000
  risk_min_pct: 5.0
  risk_max_pct: 12.0
  public_leverage_cap: 25
  personal_leverage_cap: 10
  maintenance_margin_pct: 0.5
  # портфельный предохранитель
  max_open_trades: 3
  max_open_risk_pct: 36.0
  dd_half_pct: 30          # просадка от пика: риск вдвое меньше
  dd_pause_pct: 50         # новые входы стоп, владельцу уведомление
  dd_pause_days: 7         # длина паузы, потом просадка считается от нового пика
  loss_streak: 3           # серия убытков подряд: риск вдвое меньше
  min_stop_pct: 1.5        # стоп уже: комиссия больше ~0.1R, сигнал не берётся

scanner:
  interval_minutes: 60
  max_signals_per_day: 2
  min_strength: 0.6
  correlation_window_hours: 168
  correlation_threshold: 0.8

indicators:
  zscore_window: 168
  pivot_left: 3
  pivot_right: 3
  divergence_lookback: 60
  divergence_max_age: 5
  rsi_period: 14
  trend_ema_fast: 20
  trend_ema_slow: 50
  weights:
    oi: 1.0
    funding: 1.0
    cvd_futures: 1.0
    cvd_spot: 1.0
    premium: 0.5
    liquidations: 1.0
  fear_greed:
    long_block_above: 85
    short_block_below: 15

liq_map:
  leverages: [10, 25, 50, 100]
  bin_pct: 0.25

storage:
  db_path: data/sigbot.sqlite
  keep_1m_days: 14

llm:
  # ключ GEMINI_API_KEY из .env; при ошибке или таймауте берётся запасная модель
  model: gemini-flash-latest
  fallback_model: gemini-flash-lite-latest
  timeout_s: 60

engine:
  setup: [capitulation, trend]   # capitulation, trend, divergence (v1); можно списком
  min_divergence_score: 1.0    # одна регулярная или две скрытые дивергенции
  min_index: 0.0               # индекс не против сделки
  stop_atr_buffer: 0.3
  min_stop_atr: 0.7
  tp1_r: 1.2
  tp2_r: 2.5
  tp2_snap_min_r: 1.8          # tp2 переносится на кластер ликвидаций в этом диапазоне
  tp2_snap_max_r: 4.0
  max_hold_hours: 72

capitulation:
  min_drop_sigma: 2.5          # падение за 24ч в суточных сигмах
  require_oi_drop: true        # OI за сутки снизился: позиции вынесены
  stop_sigma: 3.0
  tp1_sigma: 1.25
  target_sigma: 2.5

trend:
  ma_fast: 20                  # дневные MA
  ma_slow: 50
  stop_atr: 2.0                # стоп в дневных ATR
  trail_atr: 3.0               # трейлинг от дневного закрытия
  max_hold_days: 45
  ref_target_r: 3.0            # ориентир цели в посте, выход трейлингом
  strength: 0.0                # риск по нижней границе

portfolio:
  enabled: true
  top_n: 30                    # универсум: топ по обороту
  donchian: [10, 20, 40, 80, 160]
  ma_fast: 20
  ma_slow: 50
  allow_short: true
  vol_window: 30
  target_vol: 0.5              # целевая годовая волатильность портфеля (0.4 спокойнее, 0.6 агрессивнее)
  max_gross: 3.0               # потолок суммарного плеча
  post_hour_utc: 0             # пересчёт сразу после закрытия суток

listings:
  enabled: true
  notional_pct: 1.5            # шорт на каждый новый листинг, % капитала (убыток по стопу ~0.75%)
  stop_pct: 50                 # стоп при росте на 50% от входа
  hold_days: 60
  max_entry_delay_days: 2      # если бот узнал о листинге позже, сделка пропускается

trade:
  tp1_close_fraction: 0.5
  breakeven_at_fraction_to_tp2: 0.5   # половина пути к tp2 переносит стоп в безубыток
  second_entry: false                 # v1: второго входа нет
  fee_taker_pct: 0.05

backtest:
  start: "2024-11-01"
  end: "2026-10-31"
  train_days: 90
  test_days: 30
  min_strength_grid: [0.5, 0.6, 0.7]
  min_trades_train: 8

schedule:
  daily_note_hour_utc: 13
  weekly_day: 6                # воскресенье
  weekly_hour_utc: 15

dashboard:
  host: 127.0.0.1
  port: 8787

bloggers:
  zone_expiry_days: 14
  zone_merge_pct: 0.5
